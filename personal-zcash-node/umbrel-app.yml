manifestVersion: 1.1
id: personal-zcash-node
name: Zcash Node
tagline: Run your own Zcash full node
icon: https://raw.githubusercontent.com/nickpio/umbrel-app-store/main/personal-zcash-node/icon.png?v=0.1.10
category: finance
version: "0.1.10"
port: 8230
description: >-
  Run a Zcash full node on umbrelOS, powered by Zebra or Zakura, with a
  lightwalletd wallet server so Vizor, Zodl, Ywallet, and Zingo can connect
  to your own node.


  Independently store and validate the Zcash chain. Connect your wallet
  directly to this node so you are not trusting a third-party lightwalletd.


  lightwalletd is plaintext on port 9067 by default. When the Umbrel Tailscale
  app is installed and MagicDNS + HTTPS Certificates are enabled, this app
  fetches a Let’s Encrypt certificate so Vizor can connect to your MagicDNS
  hostname on port 9067 over HTTPS. JSON-RPC is on 8232 and P2P is on 8233.
developer: nickpio
website: https://github.com/nickpio/umbrel-zcash
repo: https://github.com/nickpio/umbrel-zcash
support: https://github.com/nickpio/umbrel-zcash/issues
submitter: nickpio
submission: https://github.com/nickpio/umbrel-zcash
path: ""
dependencies: []
gallery: []
releaseNotes: >-
  Fix Insights fees, subsidy, and block size for Zebra. Median fee is in zat,
  rewards use the Zcash subsidy schedule, and peer Connected/Relay no longer
  invent Bitcoin-only fields Zebra does not send.
widgets:
  - id: stats
    type: four-stats
    refresh: 5s
    endpoint: app:3000/api/widget/stats
  - id: sync
    type: text-with-progress
    refresh: 2s
    endpoint: app:3000/api/widget/sync
backupIgnore:
  - data/zebra
  - data/zakura
  - data/lightwalletd
