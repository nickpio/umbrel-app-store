manifestVersion: 1.1
id: personal-sovbalance
name: sovBalance
tagline: Track Bitcoin, Monero, and Zcash wallets privately from your own Umbrel
icon: https://raw.githubusercontent.com/nickpio/umbrel-app-store/main/personal-sovbalance/icon.png
category: bitcoin
version: "1.3.0"
port: 3710
description: >-
  Track your Bitcoin, Monero, and Zcash wallets privately from your own Umbrel.


  Monitor Bitcoin balances using XPUB, YPUB, or ZPUB, Monero view-only
  wallets using a primary address plus private view key, and Zcash
  transparent addresses through your local lightwalletd.


  Connects to your local Electrs, optional Monero Node, and optional
  Zcash Node apps for maximum privacy, without relying on third-party
  balance APIs.


  Stop checking balances on block explorers. Your wallets. Your node. Your privacy.


  Supports multiple wallets, automatic gap limit scanning for Bitcoin, and
  view-only scanning for Monero directly from your Umbrel node.
developer: nickpio
website: https://github.com/nickpio/sovbalance
repo: https://github.com/nickpio/sovbalance
support: https://github.com/nickpio/sovbalance/issues
submitter: nickpio
submission: https://github.com/nickpio/sovbalance
path: ""
dependencies:
  - electrs
gallery:
  - https://raw.githubusercontent.com/nickpio/umbrel-app-store/main/personal-sovbalance/screenshot.png
releaseNotes: >-
  Adds optional Zcash support. Track transparent t1/t3 addresses through
  your Zcash Node lightwalletd. Zcash Node is not required to install
  the app. Restart sovBalance after installing Zcash Node. Also updates
  the app icon for Bitcoin, Monero, and Zcash.
