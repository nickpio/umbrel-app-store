manifestVersion: 1.1
id: personal-sovbalance
name: sovBalance
tagline: Track Bitcoin, Monero, and Zcash wallets privately from your own Umbrel
icon: https://raw.githubusercontent.com/nickpio/umbrel-app-store/main/personal-sovbalance/icon.png?v=1.6.0
category: bitcoin
version: "1.6.0"
port: 3710
description: >-
  Track your Bitcoin, Monero, and Zcash wallets privately from your own Umbrel.


  Monitor Bitcoin balances using XPUB, YPUB, or ZPUB, Monero view-only
  wallets using a primary address plus private view key, and Zcash
  transparent addresses or unified viewing keys through your local
  lightwalletd.


  Automatically detects which node apps you have installed (Electrs,
  Fulcrum, or ElectrumX for Bitcoin, Monero Node, Zcash Node) and shows
  the matching currencies. Install any one of them to get started. No
  third-party balance APIs.


  Stop checking balances on block explorers. Your wallets. Your node. Your privacy.


  Supports multiple wallets, automatic gap limit scanning for Bitcoin, and
  view-only scanning for Monero directly from your Umbrel node.
developer: nickpio
website: https://github.com/nickpio/sovbalance
repo: https://github.com/nickpio/sovbalance
support: https://github.com/nickpio/sovbalance/issues
submitter: nickpio
submission: https://github.com/nickpio/sovbalance
path: ""
dependencies: []
gallery:
  - https://raw.githubusercontent.com/nickpio/umbrel-app-store/main/personal-sovbalance/screenshot.png
releaseNotes: >-
  Monero spends are now detected automatically. sovBalance reads the
  input rings of the wallet's incoming transactions from your Monero
  Node and removes spent outputs without key images. Monero wallets
  also refresh in the background, so balances update on their own.
